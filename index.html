<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitkat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
      cursor: none;
      overflow: hidden;
    }
 
    /* CURSOR */
    .cursor {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
      position: fixed;
      z-index: 99999;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform 0.1s ease;
    }
 
    /* LOADER */
    #loader {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease;
    }
 
    .loader-ring {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.1);
      border-top: 2px solid white;
      animation: spin 0.8s linear infinite;
    }
 
    @keyframes spin { to { transform: rotate(360deg); } }
 
    /* STARS / PARTICLES */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }
 
    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0;
      animation: twinkle var(--d) ease-in-out infinite var(--delay);
    }
 
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: var(--o); }
    }
 
    /* MUSIC BTN */
    #music-btn {
      position: fixed;
      top: 20px;
      left: 20px;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      color: rgba(255,255,255,0.6);
      font-size: 14px;
      z-index: 9999;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    #music-btn:hover { background: rgba(255,255,255,0.08); color: white; }
 
    /* VIEWS COUNTER */
    .views {
      position: fixed;
      bottom: 20px;
      left: 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      gap: 6px;
      z-index: 9999;
    }
    .views i { font-size: 11px; }
 
    /* SCROLL HINT */
    .scroll-hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: rgba(255,255,255,0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      z-index: 9999;
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(4px); }
    }
 
    /* NAV DOTS */
    .nav-dots {
      position: fixed;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 9999;
    }
    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: 0.3s;
    }
    .nav-dot.active {
      background: white;
      transform: scale(1.4);
    }
 
    /* HERO */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      animation: fadeIn 1.4s ease forwards;
      opacity: 0;
      animation-delay: 1.8s;
    }
 
    @keyframes fadeIn {
      to { opacity: 1; }
    }
 
    /* PROFILE */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
 
    /* AVATAR */
    .avatar-wrap {
      position: relative;
      margin-bottom: 18px;
    }
 
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: #111;
      display: block;
    }
 
    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.08);
    }
 
    /* NAME */
    .name {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin-bottom: 10px;
      color: rgba(255,255,255,0.9);
    }
 
    /* BADGES ROW */
    .badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 12px;
      padding: 6px 10px;
    }
 
    .badges img {
      width: 22px;
      height: 22px;
      object-fit: contain;
      border-radius: 5px;
      opacity: 0.9;
    }
 
    /* TYPING */
    .typing-line {
      height: 18px;
      font-size: 13px;
      color: rgba(255,255,255,0.35);
      font-weight: 300;
      margin-bottom: 24px;
      letter-spacing: 0.03em;
    }
 
    #typed-text::after {
      content: '|';
      animation: blink 1s step-end infinite;
      color: rgba(255,255,255,0.4);
      margin-left: 1px;
    }
 
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
 
    /* SOCIALS */
    .socials {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
 
    .socials a {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: rgba(255,255,255,0.6);
      font-size: 16px;
      transition: 0.2s;
      backdrop-filter: blur(10px);
    }
 
    .socials a:hover {
      background: rgba(255,255,255,0.09);
      color: white;
      border-color: rgba(255,255,255,0.18);
      transform: translateY(-2px);
    }
 
    /* AUDIO */
    audio { display: none; }
 
    /* TILT CARD */
    .profile {
      transform-style: preserve-3d;
      transition: transform 0.08s linear;
      will-change: transform;
    }
 
    /* TRAIL DOT */
    .trail-dot {
      position: fixed;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: white;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      animation: trailFade 0.6s ease forwards;
    }
 
    @keyframes trailFade {
      0%   { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0;   transform: translate(-50%, -50%) scale(0.2); }
    }
  </style>
</head>
<body>
 
<!-- LOADER -->
<div id="loader">
  <div class="loader-ring"></div>
</div>
 
<!-- CURSOR -->
<div class="cursor" id="cursor"></div>
 
<!-- STARS -->
<div class="stars" id="stars"></div>
 
<!-- AUDIO -->
<audio id="audio" loop>
  <source src="assets/music.mp3" type="audio/mp3">
</audio>
 
<!-- MUSIC BTN -->
<button id="music-btn">
  <i class="fa-solid fa-volume-high"></i>
</button>
 
<!-- NAV DOTS -->
<div class="nav-dots">
  <div class="nav-dot active"></div>
  <div class="nav-dot"></div>
  <div class="nav-dot"></div>
</div>
 
<!-- VIEWS -->
<div class="views">
  <i class="fa-regular fa-eye"></i>
  <span>71,063</span>
  &nbsp;|&nbsp;
  <i class="fa-solid fa-location-dot"></i>
  <span>The Bronx, NY</span>
</div>
 
<!-- SCROLL HINT -->
<div class="scroll-hint">
  <span>Scroll for more</span>
  <i class="fa-solid fa-arrow-down" style="font-size:10px;"></i>
</div>
 
<!-- HERO -->
<section class="hero">
  <div class="profile">
 
    <div class="avatar-wrap">
      <img src="assets/avatar.png" class="avatar" onerror="this.src='https://i.pravatar.cc/120'">
      <div class="avatar-ring"></div>
    </div>
 
    <div class="name">Kitkat</div>
 
    <!-- BADGES avec les vraies images -->
    <div class="badges">
      <img src="purpleownr1.png" alt="premium" title="premium">
      <img src="purple5star.png" alt="Owner" title="Owner">
      <img src="purpleownr2.png" alt="Sword" title="Sword">
      <img src="purpleswrd.png" alt="schilde" title="schilde">
      <img src="purplemod.png" alt="Kitkat" title="kitkat">
    </div>
 
    <div class="typing-line">
      <span id="typed-text"></span>
    </div>
 
    <div class="socials">
      <a href="https://discord.gg/leak2ids" target="_blank" title="Discord">
        <i class="fa-brands fa-discord"></i>
      </a>
      <a href="https://t.me/kitkat2rose" target="_blank" title="Telegram">
        <i class="fa-brands fa-telegram"></i>
      </a>
      <a href="LdmaWT9WQHoxjnD5USj9AKumK8j5YBQ9TR" target="_blank" title="Litecoin">
        <i class="fa-brands fa-Litecoin"></i>
      </a>
      <a href="https://instagram.com/" target="_blank" title="Instagram">
        <i class="fa-brands fa-instagram"></i>
      </a>
      <a href="https://youtube.com/" target="_blank" title="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>
    </div>
 
  </div>
</section>
 
<script>
  // LOADER
  window.addEventListener("load", () => {
    setTimeout(() => {
      const loader = document.getElementById("loader");
      loader.style.opacity = "0";
      setTimeout(() => loader.style.display = "none", 1000);
    }, 1800);
  });
 
  // CURSOR
  const cursor = document.getElementById("cursor");
 
  // TILT
  const profile = document.querySelector(".profile");
  const cx = () => window.innerWidth / 2;
  const cy = () => window.innerHeight / 2;
 
  // TRAIL
  let lastTrail = 0;
 
  window.addEventListener("mousemove", e => {
    cursor.style.left = e.clientX + "px";
    cursor.style.top = e.clientY + "px";
 
    // 3D tilt
    const dx = (e.clientX - cx()) / cx();
    const dy = (e.clientY - cy()) / cy();
    const rotX = -dy * 12;
    const rotY =  dx * 12;
    profile.style.transform = `perspective(800px) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
 
    // Trail dots
    const now = Date.now();
    if (now - lastTrail > 40) {
      lastTrail = now;
      const dot = document.createElement("div");
      dot.className = "trail-dot";
      dot.style.left = e.clientX + "px";
      dot.style.top  = e.clientY + "px";
      // randomize size slightly
      const s = 2 + Math.random() * 4;
      dot.style.width  = s + "px";
      dot.style.height = s + "px";
      document.body.appendChild(dot);
      setTimeout(() => dot.remove(), 600);
    }
  });
 
  // Reset tilt on mouse leave
  document.addEventListener("mouseleave", () => {
    profile.style.transform = "perspective(800px) rotateX(0deg) rotateY(0deg)";
  });
 
  // STARS
  const starsEl = document.getElementById("stars");
  for (let i = 0; i < 120; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      --d: ${2 + Math.random() * 5}s;
      --delay: ${-Math.random() * 6}s;
      --o: ${0.1 + Math.random() * 0.5};
      width: ${Math.random() < 0.3 ? 3 : 2}px;
      height: ${Math.random() < 0.3 ? 3 : 2}px;
    `;
    starsEl.appendChild(s);
  }
 
  // MUSIC
  const audio = document.getElementById("audio");
  const musicBtn = document.getElementById("music-btn");
  let playing = false;
  musicBtn.addEventListener("click", () => {
    if (!playing) {
      audio.play();
      musicBtn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
    } else {
      audio.pause();
      musicBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
    }
    playing = !playing;
  });
 
  // TYPING
  const texts = ["/leak2ids"];
  let tIdx = 0, cIdx = 0;
  const el = document.getElementById("typed-text");
 
  function typeEffect() {
    if (cIdx < texts[tIdx].length) {
      el.textContent += texts[tIdx][cIdx++];
      setTimeout(typeEffect, 90);
    } else {
      setTimeout(eraseEffect, 1600);
    }
  }
  function eraseEffect() {
    if (cIdx > 0) {
      el.textContent = texts[tIdx].substring(0, --cIdx);
      setTimeout(eraseEffect, 50);
    } else {
      tIdx = (tIdx + 1) % texts.length;
      setTimeout(typeEffect, 400);
    }
  }
  typeEffect();
</script>
 
</body>
</html>
